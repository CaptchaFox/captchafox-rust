name: Release

# Runs when a version tag is pushed: publishes the version to crates.io, then creates the GitHub release. Tags on a
# commit that is not on main, or whose version or changelog does not match, are refused before anything is published.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency: release

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      # Creates the GitHub release.
      contents: write
      # Exchanged for a short-lived crates.io token by trusted publishing.
      id-token: write
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so that the check below can see whether the tag is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag points to a commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_REF_NAME} points to $(git rev-parse --short HEAD), which is not on main. Tag the tested commit on main."
            exit 1
          fi

      # The oldest supported Rust, so that the published version is tested where it must build.
      - name: Install Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup default 1.85.0

      - name: Check the version in Cargo.toml and the changelog
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"

      - name: Test
        run: cargo test

      # crates.io takes a trusted publisher only for a crate that exists, so the first version is published with the
      # API token in the secret CARGO_REGISTRY_TOKEN. Without that secret, the workflow uses trusted publishing.
      - name: Check for an API token
        id: token
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: echo "set=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: steps.token.outputs.set == 'false'

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "CaptchaFox for Rust ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
